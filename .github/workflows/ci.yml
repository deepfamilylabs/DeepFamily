name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.10.0

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Circom compiler
        run: npm run zk:fetch

      - name: Check ZK artifacts and proofs
        run: npm run zk:artifacts:check && npm run zk:check

      - name: Lint (solhint)
        run: npm run lint

      - name: Frontend checks
        run: npm run frontend:check

      - name: Build (compile contracts)
        run: npm run build
        env:
          CONTRACT_SIZER_STRICT: "false"

      - name: Check storage layouts
        run: npm run storage:check

      - name: Test
        run: npm test
        env:
          REPORT_GAS: "true"
