name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Circom compiler
        run: npm run zk:fetch

      - name: Check ZK artifacts and proofs
        run: npm run zk:artifacts:check && npm run zk:check

      - name: Lint (solhint)
        run: npm run lint

      - name: Build (compile contracts)
        run: npm run build
        env:
          CONTRACT_SIZER_STRICT: "false"

      - name: Frontend checks
        run: npm run frontend:check

      - name: Check committed frontend ABIs
        run: git diff --exit-code -- frontend/src/abi

      - name: Check storage layouts
        run: npm run storage:check

      - name: Test
        run: npm test
        env:
          REPORT_GAS: "true"

  zk-native-platforms:
    name: ZK native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            node_arch: arm64
          - name: windows-x64
            os: windows-latest
            node_arch: x64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          architecture: ${{ matrix.node_arch }}

      - name: Check Node execution architecture
        run: node -e "if (process.arch !== '${{ matrix.node_arch }}') throw new Error('Expected ${{ matrix.node_arch }}, got ' + process.arch)"

      - name: Install protected Rust toolchain for macOS source builds
        if: matrix.name == 'macos-arm64'
        shell: bash
        env:
          DEEPFAMILY_RUSTUP_VERSION: "1.28.2"
          DEEPFAMILY_RUSTUP_INIT_SHA256: "20ef5516c31b1ac2290084199ba77dbbcaa1406c45c1d978ca68558ef5964ef5"
          DEEPFAMILY_RUST_TOOLCHAIN: "1.89.0"
        run: |
          set -euo pipefail
          umask 077

          deepfamily_bootstrap_directory="$HOME/.deepfamily/rustup-bootstrap"
          deepfamily_rustup_init="$deepfamily_bootstrap_directory/rustup-init"
          for deepfamily_directory in \
            "$HOME/.deepfamily" \
            "$deepfamily_bootstrap_directory" \
            "$HOME/.cargo" \
            "$HOME/.cargo/bin" \
            "$HOME/.rustup"; do
            if [[ -L "$deepfamily_directory" ]]; then
              echo "Rust bootstrap directory must not be a symbolic link: $deepfamily_directory" >&2
              exit 1
            fi
          done
          mkdir -p \
            "$deepfamily_bootstrap_directory" \
            "$HOME/.cargo/bin" \
            "$HOME/.rustup"
          chmod 700 \
            "$HOME/.deepfamily" \
            "$deepfamily_bootstrap_directory" \
            "$HOME/.cargo" \
            "$HOME/.cargo/bin" \
            "$HOME/.rustup"

          curl --proto '=https' --tlsv1.2 --retry 5 --retry-connrefused \
            --location --fail --silent --show-error \
            "https://static.rust-lang.org/rustup/archive/${DEEPFAMILY_RUSTUP_VERSION}/aarch64-apple-darwin/rustup-init" \
            --output "$deepfamily_rustup_init"
          deepfamily_actual_sha256="$(shasum -a 256 "$deepfamily_rustup_init" | awk '{print $1}')"
          if [[ "$deepfamily_actual_sha256" != "$DEEPFAMILY_RUSTUP_INIT_SHA256" ]]; then
            echo "rustup-init SHA-256 mismatch" >&2
            exit 1
          fi
          chmod 700 "$deepfamily_rustup_init"

          env -i \
            HOME="$HOME" \
            PATH="/usr/bin:/bin" \
            CARGO_HOME="$HOME/.cargo" \
            RUSTUP_HOME="$HOME/.rustup" \
            "$deepfamily_rustup_init" \
              -y \
              --no-modify-path \
              --profile minimal \
              --default-toolchain "$DEEPFAMILY_RUST_TOOLCHAIN"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install native and canonical Circom compilers
        run: npm run zk:fetch

      - name: Check native ZK artifacts and real proofs
        run: npm run zk:artifacts:check && npm run zk:check

      - name: Compile contracts on the target runtime
        run: npm run build
        env:
          CONTRACT_SIZER_STRICT: "false"

      - name: Run cross-platform tests
        run: npm test
