<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFamily Logo</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="stylesheet" href="logo.css">
</head>
<body>
    <div class="container">
        <p class="eyebrow">Logo export</p>
        <h1>The mark, three ways.</h1>
        <p class="lede">Refined coral&rarr;orange mark on an even 128 grid. Pick a size, then download the app-icon lockup you need.</p>

        <div class="controls">
            <div class="control-group">
                <label for="sizeSelect">Size:</label>
                <select id="sizeSelect" class="size-select">
                    <option value="64">64 &times; 64 (Favicon)</option>
                    <option value="128">128 &times; 128 (Default)</option>
                    <option value="180" selected>180 &times; 180 (Apple touch)</option>
                    <option value="512">512 &times; 512 (PWA)</option>
                    <option value="1024">1024 &times; 1024 (Max)</option>
                </select>
            </div>
        </div>

        <div class="grid" id="grid">
            <div class="card">
                <div class="preview">
                    <canvas data-style="grad" id="canvas-grad"></canvas>
                </div>
                <span class="cap">White on gradient</span>
                <button data-download="grad">Download PNG</button>
            </div>
            <div class="card">
                <div class="preview">
                    <canvas data-style="paper" id="canvas-paper"></canvas>
                </div>
                <span class="cap">Gradient on paper</span>
                <button data-download="paper">Download PNG</button>
            </div>
            <div class="card">
                <div class="preview">
                    <canvas data-style="ink" id="canvas-ink"></canvas>
                </div>
                <span class="cap">Gradient on ink</span>
                <button data-download="ink">Download PNG</button>
            </div>
            <div class="card">
                <div class="preview checker">
                    <canvas data-style="transparent" id="canvas-transparent"></canvas>
                </div>
                <span class="cap">Mark (transparent)</span>
                <button data-download="transparent">Download PNG</button>
            </div>
        </div>
    </div>

    <script src="logo.js" defer></script>
</body>
</html>
