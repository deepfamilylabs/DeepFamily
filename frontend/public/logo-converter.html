<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepFamily Logo Exporter</title>
    <link rel="stylesheet" href="/logo-converter.css">
</head>
<body>
    <div class="container">
        <h1>Logo Export Tool</h1>
        <p>Previewing generated PNG below.</p>
        
        <div class="controls" style="flex-direction: column; align-items: center;">
            <div class="control-group">
                <label>Size:</label>
                <select id="sizeSelect" class="size-select">
                    <option value="64">64 x 64 (Favicon)</option>
                    <option value="128" selected>128 x 128 (Default)</option>
                    <option value="512">512 x 512 (High Res)</option>
                    <option value="1024">1024 x 1024 (Max)</option>
                </select>
            </div>
            
            <div class="control-group">
                <label>Background:</label>
                <select id="bgShape" class="control-input">
                    <option value="none">None (Transparent)</option>
                    <option value="circle">Circle</option>
                    <option value="square">Rounded Square</option>
                </select>
            </div>

            <div class="control-group" id="swapGroup" style="display:none;">
                <label style="cursor:pointer; display:flex; align-items:center;">
                    <input type="checkbox" id="swapColors" style="margin-right: 0.5rem;">
                    Swap Colors (Brand BG)
                </label>
            </div>

            <div class="control-group" id="bgColorGroup" style="display:none;">
                <label id="colorLabel">Color:</label>
                <input type="color" id="bgColor" class="control-input" value="#ffffff">
            </div>

            <div class="control-group" id="scaleGroup" style="display:none;">
                <label>Scale:</label>
                <input type="range" id="logoScale" min="50" max="100" value="75" class="control-input">
                <span id="scaleValue" style="min-width: 3ch;">75%</span>
            </div>

            <div class="control-group" id="panGroupX" style="display:none;">
                <label>Pan X:</label>
                <input type="range" id="panX" min="-20" max="20" value="0" class="control-input">
            </div>
            
            <div class="control-group" id="panGroupY" style="display:none;">
                <label>Pan Y:</label>
                <input type="range" id="panY" min="-20" max="20" value="0" class="control-input">
            </div>
        </div>

        <div class="preview-area">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <button id="downloadButton">Download PNG</button>
        </div>
    </div>

    <!-- Hidden Source SVG -->
    <div style="display:none;">
        <svg id="source-svg" width="128" height="128" viewBox="4 2 32 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="brand-gradient" x1="4" y1="2" x2="32" y2="28" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#fb923c" />
                <stop offset="100%" stop-color="#ef4444" />
              </linearGradient>
            </defs>
            <g fill="none" stroke="url(#brand-gradient)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 8 6 L 20 6 C 24 6, 28 10, 28 16 C 28 22, 24 26, 20 26 L 8 26" />
              <line x1="8" y1="16" x2="32" y2="16" />
            </g>
        </svg>          
    </div>

    <script src="/logo-converter.js" defer></script>
</body>
</html>
